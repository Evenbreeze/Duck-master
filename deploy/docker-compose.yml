# Duck 主控 — 本地构建 duck-panel 镜像
name: duck

services:
  panel:
    container_name: duck-panel
    build:
      context: /opt/duck/source
      dockerfile: Dockerfile
    image: duck-panel:latest
    restart: always
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    env_file: /opt/duck/.env
    network_mode: host
    volumes:
      - /var/lib/duck:/var/lib/duck
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8000)); s.close()\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 120s
