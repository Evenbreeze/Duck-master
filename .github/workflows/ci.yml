name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash deploy/check-repo.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json
      - working-directory: app/dashboard
        run: npm ci && VITE_BASE_API=/api/ npm run build
      - run: bash deploy/duck.sh preflight
      - name: Docker build panel image
        run: docker build -t duck-panel:ci --build-arg TARGETARCH=amd64 .
      - name: Panel boot smoke (same import chain as container start)
        run: docker run --rm --entrypoint python duck-panel:ci /code/deploy/panel-boot-smoke.py
