name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json
      - working-directory: app/dashboard
        run: npm ci && VITE_BASE_API=/api/ npm run build
      - run: bash deploy/duck.sh preflight
      - run: |
          docker build -t duck-panel:ci .
          docker run --rm duck-panel:ci python -c "import apscheduler"
